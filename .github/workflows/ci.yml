name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file, not a pinned string: modernc.org/sqlite now requires
      # go >= 1.25, so go.mod's own directive is 1.25.0. A runner pinned below
      # that forces GOTOOLCHAIN=auto to fetch go1.25.0 as a module instead of
      # installing it — that fetched "toolchain" is trimmed and ships without
      # go tool covdata, which -coverprofile needs. Following go.mod keeps the
      # installed toolchain complete, and keeps this step from drifting out of
      # sync with go.mod again.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # pdftotext backs the PDF ingest path; without it those tests would be
      # silently skipped rather than run.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify module checksums
        run: go mod verify

      # go.mod must already be tidy: an untidy module is how a stray or stale
      # dependency slips into the build.
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build ./...
